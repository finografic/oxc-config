allowBuilds:
  # Needed: esbuild's install script links the platform binary. Already trusted via
  # onlyBuiltDependencies below — pnpm 11 asks again under the new key.
  esbuild: true
minimumReleaseAgeExclude:
  - '@finografic/project-scripts@2.0.1'
onlyBuiltDependencies:
  - esbuild
  - simple-git-hooks
